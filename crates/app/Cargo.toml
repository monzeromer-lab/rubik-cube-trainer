[package]
name = "rubiks-trainer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rubik's cube game and trainer."

# Two artifact types so the same source ships everywhere:
# - `rlib`  — what the desktop `main.rs` shim links against.
# - `cdylib` — what `cargo-apk` packages into an Android `.so`.
[lib]
name = "rubiks_trainer"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rubiks-trainer"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
bevy_panorbit_camera = { workspace = true }
cube_core = { path = "../cube_core" }
cube_input = { path = "../cube_input" }
cube_render = { path = "../cube_render" }
cube_solver = { path = "../cube_solver" }
cube_trainer = { path = "../cube_trainer" }
rand = { workspace = true }
rand_chacha = { workspace = true }

# `NativeActivity` is the older Android entry point but it pairs with
# `cargo-apk` out of the box (no Java/Kotlin glue or Gradle setup).
# For a personal sideload-and-test workflow that's enough; switching
# to `android-game-activity` later requires a Gradle wrapper.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-native-activity"] }

# `cargo-apk` reads this section to produce the APK manifest.
[package.metadata.android]
package = "com.rubikstrainer.app"
build_targets = ["aarch64-linux-android"]
# Workspace `assets/` lives at the repo root; cargo-apk packages the
# given directory under `assets/` inside the APK so Bevy's
# `AssetServer` picks the same paths up at runtime.
assets = "../../assets"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

[package.metadata.android.application]
label = "Rubik's Trainer"
